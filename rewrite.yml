---
# =====================================================================
# Recette 1 : Intégration Prometheus (Micrometer + Actuator + config)
# =====================================================================
type: specs.openrewrite.org/v1beta/recipe
name: com.lcl.rewrite.IntegrerPrometheus
displayName: Intègre Micrometer Prometheus dans un service Spring Boot
description: >
  Ajoute spring-boot-starter-actuator et micrometer-registry-prometheus,
  puis expose l'endpoint /actuator/prometheus dans application.yml.
recipeList:
  # Actuator (no-op si déjà présent)
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-actuator
      # pas de <version> : gérée par le BOM Spring Boot / parent

  # Registry Prometheus, scope runtime
  - org.openrewrite.maven.AddDependency:
      groupId: io.micrometer
      artifactId: micrometer-registry-prometheus
      scope: runtime

  # Exposition de l'endpoint dans application.yml
  - org.openrewrite.yaml.MergeYaml:
      key: $
      filePattern: '**/src/main/resources/application*.yml'
      yaml: |
        management:
          endpoints:
            web:
              exposure:
                include: health,info,prometheus
          endpoint:
            prometheus:
              access: read_only
          metrics:
            tags:
              application: ${spring.application.name}

  # Exposition de l'endpoint dans application.properties
  - org.openrewrite.properties.AddProperty:
      property: management.endpoints.web.exposure.include
      value: health,info,prometheus
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.endpoint.prometheus.access
      value: read_only
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.tags.application
      value: ${spring.application.name}
      filePattern: '**/src/main/resources/application*.properties'

---
# =====================================================================
# Recette 2 : Intégration du parent POM lcl-parent
# =====================================================================
type: specs.openrewrite.org/v1beta/recipe
name: com.lcl.rewrite.IntegrerLclParent
displayName: Remplace spring-boot-starter-parent par lcl-parent
description: >
  Bascule le <parent> du projet de spring-boot-starter-parent vers
  lcl-parent, puis supprime les versions de dépendances devenues
  redondantes (gérées par le dependencyManagement du parent).
recipeList:
  - org.openrewrite.maven.ChangeParentPom:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-parent
      newGroupId: com.lcl
      newArtifactId: lcl-parent
      newVersion: 1.0.0            # <-- adapter à la version courante du lcl-parent
      allowVersionDowngrades: false

  # Nettoyage : retire les <version> déjà gérées par le nouveau parent
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      onlyIfVersionsMatch: true
