---
# =====================================================================
# Recette : Intégration Prometheus (Micrometer + Actuator + config)
# =====================================================================
type: specs.openrewrite.org/v1beta/recipe
name: com.lcl.rewrite.IntegrerPrometheus
displayName: Intègre Micrometer Prometheus dans un service Spring Boot
description: >
  Ajoute spring-boot-starter-actuator et micrometer-registry-prometheus,
  puis pousse la configuration standard LCL (exposition endpoints, tags
  communs Grafana, histogrammes GC, métriques virtual threads) dans
  application.properties et application.yml.
recipeList:
  # ------------------------------------------------------------------
  # Dépendances
  # ------------------------------------------------------------------
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-actuator
  - org.openrewrite.maven.AddDependency:
      groupId: io.micrometer
      artifactId: micrometer-registry-prometheus
      scope: runtime

  # ------------------------------------------------------------------
  # ACTUATOR / PROMETHEUS  (application.properties)
  # ------------------------------------------------------------------
  - org.openrewrite.properties.AddProperty:
      property: management.endpoints.web.exposure.include
      value: prometheus,health,info,metrics,threaddump
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.endpoint.prometheus.enabled
      value: 'true'
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.prometheus.metrics.export.enabled
      value: 'true'
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.endpoint.health.show-details
      value: when_authorized
      filePattern: '**/src/main/resources/application*.properties'

  # ------------------------------------------------------------------
  # TAGS COMMUNS (dashboards Grafana/Prometheus)
  # ------------------------------------------------------------------
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.tags.application
      value: ${spring.application.name}
      filePattern: '**/src/main/resources/application*.properties'

  # ------------------------------------------------------------------
  # JVM GC - histogrammes pour percentiles p50/p95/p99
  # ------------------------------------------------------------------
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.enable.jvm
      value: 'true'
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.distribution.percentiles-histogram.jvm.gc.pause
      value: 'true'
      filePattern: '**/src/main/resources/application*.properties'
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.distribution.percentiles.jvm.gc.pause
      value: 0.5,0.95,0.99
      filePattern: '**/src/main/resources/application*.properties'

  # ------------------------------------------------------------------
  # JVM THREADS (virtual threads si spring.threads.virtual.enabled=true)
  # ------------------------------------------------------------------
  - org.openrewrite.properties.AddProperty:
      property: management.metrics.enable.jvm.threads
      value: 'true'
      filePattern: '**/src/main/resources/application*.properties'

  # ------------------------------------------------------------------
  # Équivalent pour les services en application.yml
  # (clés composées quotées pour les props de type Map)
  # ------------------------------------------------------------------
  - org.openrewrite.yaml.MergeYaml:
      key: $
      filePattern: '**/src/main/resources/application*.yml'
      yaml: |
        management:
          endpoints:
            web:
              exposure:
                include: prometheus,health,info,metrics,threaddump
          endpoint:
            prometheus:
              enabled: true
            health:
              show-details: when_authorized
          prometheus:
            metrics:
              export:
                enabled: true
          metrics:
            tags:
              application: ${spring.application.name}
            enable:
              jvm: true
              "jvm.threads": true
            distribution:
              percentiles-histogram:
                "jvm.gc.pause": true
              percentiles:
                "jvm.gc.pause": 0.5,0.95,0.99
